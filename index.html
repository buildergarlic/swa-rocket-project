<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>경남 로켓 발사 프로젝트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">🚀 경남 로켓 발사 프로젝트</div>
    <nav class="tabs" id="tabs">
      <button data-view="rocket" class="active">🚀 로켓 조립</button>
      <button data-view="map">🗺️ 경남 지도</button>
    </nav>
    <div class="classes" id="classes"></div>
    <div class="tools">
      <button id="teacherBtn" title="강사용 정답 보기">🔒 강사용</button>
      <button id="settingsBtn" title="설정">⚙️</button>
      <button id="fullBtn" title="전체 화면">⛶</button>
    </div>
  </header>

  <main>
    <!-- 로켓 조립 화면 -->
    <section class="view active" id="view-rocket">
      <div class="stage" id="stage">
        <div class="sky"></div>
        <div class="stars"><i>★</i><i>★</i><i>✦</i><i>★</i><i>✦</i><i>★</i></div>
        <svg id="rocketSvg" viewBox="0 0 420 775" preserveAspectRatio="xMidYMax meet"></svg>
        <div class="banner" id="banner"></div>
        <div class="part-card" id="partCard"></div>
        <div class="sat-load" id="satLoad">🛰️</div>
        <div class="num-input" id="numInput"></div>
        <button class="launch-btn" id="launchBtn" hidden>🔥 발사 준비 완료! 눌러서 카운트다운 시작</button>
      </div>
      <aside class="parts">
        <div class="progress">
          <div class="progress-text"><b id="countText">0 / 12</b> 부품 도착</div>
          <div class="bar"><div id="barFill"></div></div>
        </div>
        <div class="part-grid" id="partGrid"></div>
        <p class="hint">부품이 도착하면 버튼을 누르거나 키보드로 번호(1~<span id="maxNo"></span>)를 치세요. 두 자리는 연달아 치면 돼요(예: 2, 7 → 27번). 잘못 눌렀으면 그 버튼을 다시 누르면 취소됩니다.</p>
      </aside>
    </section>

    <!-- 경남 지도 화면 -->
    <section class="view" id="view-map">
      <div class="map-wrap">
        <svg id="mapSvg"></svg>
        <div class="map-nav" id="mapNav" hidden>
          <button id="prevSheet">◀ 이전 장</button>
          <button id="allSheets">🗺️ 전체 지도</button>
          <button id="nextSheet">다음 장 ▶</button>
        </div>
      </div>
      <aside class="map-panel" id="mapPanel"></aside>
    </section>
  </main>

  <!-- 설정 -->
  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2>⚙️ 설정</h2>
      <fieldset>
        <legend>학교</legend>
        <div id="setSchools"></div>
      </fieldset>
      <fieldset>
        <legend>반 (진행 상황은 반마다 따로 저장됩니다)</legend>
        <div id="setClasses"></div>
      </fieldset>
      <fieldset>
        <legend>발사</legend>
        <label>카운트다운 <input type="number" id="setCountdown" min="3" max="10"> 초</label>
        <label><input type="checkbox" id="setSound"> 효과음과 현장음 켜기</label>
        <label><input type="checkbox" id="setVoice"> 안내 방송 목소리 켜기</label>
        <div class="row"><button type="button" id="previewLaunch">🎬 발사 장면 전체 미리 보기</button><button type="button" id="previewQuick">⏩ 카운트다운부터 보기</button></div>
        <label>마지막 자막 1줄 <input id="setCaption1" size="40"></label>
        <label>마지막 자막 2줄 <input id="setCaption2" size="40"></label>
      </fieldset>
      <fieldset>
        <legend>카운트다운 목소리</legend>
        <div class="muted" id="voiceState"></div>
        <div class="row">
          <button type="button" id="voiceTest">🔊 컴퓨터 목소리 들어 보기</button>
          <button type="button" id="recStart">🎙️ 선생님 목소리로 녹음</button>
          <button type="button" id="recPreview">▶ 녹음 듣기</button>
          <button type="button" id="recDelete" class="danger">녹음 지우기</button>
          <b id="recCount" class="rec-count"></b>
        </div>
      </fieldset>
      <fieldset>
        <legend>초기화</legend>
        <button type="button" id="resetClass" class="danger">현재 반 진행 상황 지우기</button>
        <button type="button" id="resetAll" class="danger">모든 반 진행 상황 지우기</button>
      </fieldset>
      <div class="settings-actions">
        <button value="cancel">닫기</button>
        <button id="saveSettings" value="save" class="primary">저장</button>
      </div>
    </form>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/parts.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/cinema.js"></script>
  <script src="js/rocket.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
